      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 13px;
      background: #2d2d2e;
      color: #f5f5f5;
      text-align: left;
      text-decoration: none;
    }
    .preview-setting-row__icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: rgba(244,122,31,.14); color: #f58a3b; }
    .preview-setting-row__copy { min-width: 0; }
    .preview-setting-row__copy strong,
    .preview-setting-row__copy small { display: block; }
    .preview-setting-row__copy strong { font-size: 14px; }
    .preview-setting-row__copy small { margin-top: 3px; overflow: hidden; color: #aaa; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .preview-privacy-note { margin: auto 16px max(16px,env(safe-area-inset-bottom)); color: #999; font-size: 11px; line-height: 1.7; }
    .preview-scrim { position: fixed; inset: 0; z-index: 14; border: 0; border-radius: 0; background: rgba(0,0,0,.48); }
    .preview-scrim[hidden] { display: none; }
    .preview-toast { position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 20; max-width: min(88vw,420px); padding: 9px 14px; transform: translateX(-50%); border-radius: 999px; background: rgba(20,20,20,.9); color: #fff; font-size: 12px; pointer-events: none; }
    .preview-toast[hidden] { display: none; }
    .preview-model-dialog { width: min(520px,calc(100vw - 24px)); padding: 0; border: 1px solid #3d3d3e; border-radius: 18px; background: #252526; color: #f5f5f5; }
    .preview-model-dialog::backdrop { background: rgba(0,0,0,.58); }
    .preview-model-form { padding: 18px; display: grid; gap: 14px; }
    .preview-model-form header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .preview-model-form h2 { margin: 0; font-size: 19px; }
    .preview-model-form label { display: grid; gap: 7px; color: #ddd; font-size: 13px; }
    .preview-model-form select,
    .preview-model-form input[type="number"] { min-height: 42px; border: 1px solid #4b4b4c; border-radius: 10px; background: #1d1d1e; color: #fff; }
    .preview-range-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .preview-range-head input { width: 84px; padding: 0 9px; }
    .preview-model-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .preview-model-actions button { min-height: 42px; }
    .preview-message.is-pending { opacity: .72; }
    @media (max-width: 760px) {
      .preview-menu-button,
      .preview-settings-button { width: 44px; min-height: 44px; }
    }
  </style>
</head>
<body class="has-preview">
  <main class="dialogue-host" aria-label="惑梦对话">
    <iframe
      id="dialogue-frame"
      class="dialogue-frame"
      title="惑梦对话"
      name="homer-dialogue-module"
      sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox"
      allow="autoplay; clipboard-read; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      referrerpolicy="same-origin"
    ></iframe>
  </main>
  <section class="launcher" aria-live="polite" aria-busy="true">
    <section class="conversation-preview" aria-label="对话内容快速预览">
      <aside id="preview-left-drawer" class="preview-sidebar" aria-label="导航与历史会话" aria-hidden="true">
        <header class="preview-drawer-head"><strong>导航与历史</strong><button id="preview-left-close" class="preview-drawer-close" type="button" aria-label="关闭导航">×</button></header>
        <nav class="preview-site-nav">
          <a href="/app/me.html"><i>⌂</i><span>我的</span></a>
          <a href="/app/explore.html"><i>⌕</i><span>探索</span></a>
          <a href="/app/favorites.html"><i>♡</i><span>收藏</span></a>
          <a href="/app/workshop.html"><i>✦</i><span>创意工坊</span></a>
        </nav>
        <section class="preview-history">
          <div class="preview-history-title">历史会话 <span id="preview-history-count">0</span></div>
          <div id="preview-history-list" class="preview-history-list"></div>
        </section>
      </aside>
      <section class="preview-stage">
        <header class="preview-header">
          <button id="preview-menu" class="preview-menu-button" type="button" aria-label="打开导航与历史会话"><span></span><span></span><span></span></button>
          <img id="preview-avatar" class="preview-avatar" src="/assets/img/apk/avatar.webp?v=20260901-persistent-pages" alt="">
          <div class="preview-heading" aria-hidden="true">
            <h2 id="preview-title">角色对话</h2>
            <p id="preview-status">本地对话</p>
          </div>
          <button id="preview-settings" class="preview-settings-button" type="button" aria-label="打开对话设置">⚙</button>
        </header>
        <aside id="preview-network-banner" class="preview-network-banner" aria-live="polite">
          <img src="/assets/img/brand/network-error-512.png?v=20260901-persistent-pages" alt="">
          <div><strong>连接暂时不可用</strong><small id="preview-network-detail">本地会话仍可阅读，恢复网络后可以继续对话。</small></div>
          <button id="preview-network-retry" type="button">重试</button>
        </aside>
        <div id="preview-messages" class="preview-messages"></div>
        <form id="preview-composer" class="preview-composer">
          <textarea id="preview-input" rows="1" maxlength="10000" placeholder="输入想发送的消息"></textarea>
          <button id="preview-send" type="submit">发送</button>
        </form>
      </section>
      <aside id="preview-settings-drawer" class="preview-settings-drawer" aria-label="对话设置" aria-hidden="true">
        <header class="preview-drawer-head"><strong>对话设置</strong><button id="preview-settings-close" class="preview-drawer-close" type="button" aria-label="关闭设置">×</button></header>
        <div class="preview-setting-list">
          <button id="preview-model-settings" class="preview-setting-row" type="button"><span class="preview-setting-row__icon">◉</span><span class="preview-setting-row__copy"><strong>模型设置</strong><small id="preview-model-summary">当前会话模型</small></span><span>›</span></button>
          <button class="preview-setting-row" data-runtime-section="preset" type="button"><span class="preview-setting-row__icon">☷</span><span class="preview-setting-row__copy"><strong>预设开关</strong><small>仅作用于当前对话</small></span><span>›</span></button>
          <a class="preview-setting-row" href="/app/favorites.html"><span class="preview-setting-row__icon">♡</span><span class="preview-setting-row__copy"><strong>收藏</strong><small>管理已收藏角色卡</small></span><span>›</span></a>
          <button class="preview-setting-row" data-runtime-section="memory" type="button"><span class="preview-setting-row__icon">∞</span><span class="preview-setting-row__copy"><strong>长记忆</strong><small>当前对话记忆</small></span><span>›</span></button>
          <button class="preview-setting-row" data-runtime-section="mod" type="button"><span class="preview-setting-row__icon">◇</span><span class="preview-setting-row__copy"><strong>Mod</strong><small>管理当前会话 Mod</small></span><span>›</span></button>
        </div>
        <p class="preview-privacy-note">角色卡世界书正文受创作者保护。这里只提供创作者允许开放的预设开关。</p>
      </aside>
      <button id="preview-scrim" class="preview-scrim" type="button" aria-label="关闭侧栏" hidden></button>
      <p id="preview-toast" class="preview-toast" hidden></p>
    </section>
    <div class="launcher-card">
      <img id="launcher-visual" class="launcher-visual" src="/assets/img/brand/launch-loading-1080x1920.png?v=20260901-persistent-pages" alt="">
      <p class="eyebrow">惑梦</p>
      <h1 id="launcher-title">加载中</h1>
      <p id="launcher-detail">正在准备对话…</p>
      <div class="progress" aria-hidden="true"></div>
      <div class="actions">
        <button id="launcher-retry" type="button">重新连接</button>
        <a href="/app/histories.html">历史会话</a>
        <a href="/app/explore.html">返回探索</a>
      </div>
    </div>
  </section>

  <dialog id="preview-model-dialog" class="preview-model-dialog">
    <form id="preview-model-form" class="preview-model-form" method="dialog">
      <header><h2>模型设置</h2><button id="preview-model-close" type="button" aria-label="关闭">×</button></header>
      <label>当前模型<select id="preview-model-select"></select></label>
      <label><span class="preview-range-head"><span>温度</span><input data-model-number="temperature" type="number" min="0" max="2" step="0.05"></span><input data-model-range="temperature" type="range" min="0" max="2" step="0.05"></label>
      <label><span class="preview-range-head"><span>Top-P</span><input data-model-number="top_p" type="number" min="0" max="1" step="0.01"></span><input data-model-range="top_p" type="range" min="0" max="1" step="0.01"></label>
      <label><span class="preview-range-head"><span>词频惩罚</span><input data-model-number="frequency_penalty" type="number" min="-2" max="2" step="0.05"></span><input data-model-range="frequency_penalty" type="range" min="-2" max="2" step="0.05"></label>
      <label><span class="preview-range-head"><span>存在惩罚</span><input data-model-number="presence_penalty" type="number" min="-2" max="2" step="0.05"></span><input data-model-range="presence_penalty" type="range" min="-2" max="2" step="0.05"></label>
      <footer class="preview-model-actions"><button id="preview-model-cancel" type="button">取消</button><button id="preview-model-save" type="submit">保存到本次会话</button></footer>
    </form>
  </dialog>

  <p id="dialogue-announcer" class="sr-only" aria-live="assertive"></p>
  <noscript>需要启用 JavaScript 才能进入对话。</noscript>
<script type="module" src="/app/assets/js/chat.js?v=20260904-instant-history-v1"></script>
</body>
</html>
